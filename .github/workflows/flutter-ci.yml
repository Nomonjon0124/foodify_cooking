name: Flutter CI

on:
  pull_request:
    branches:
      - dev
      - pre-prod
      - prod
  push:
    branches:
      - dev
      - pre-prod
      - prod

jobs:
  analyze-and-test:
    name: Flutter analyze and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.41.6'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test
